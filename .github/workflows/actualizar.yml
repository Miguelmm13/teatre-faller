name: Actualizar datos

on:
  schedule:
    # Una revisión al día por la mañana (hacia las 9-10 de Valencia). Minuto 17 para evitar la
    # saturación de GitHub a las en punto; GitHub puede retrasar el arranque varias horas, así que
    # no se filtra por hora: cualquier ejecución programada hace la revisión.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      verificar:
        description: "Releer las obras guardadas y comparar (no añade obras)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Arrancar
        id: hora
        run: |
          echo "seguir=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == '1'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == '1'
        with:
          python-version: "3.12"

      - name: Verificar el lector con las obras conocidas
        if: steps.hora.outputs.seguir == '1' && (github.event_name == 'push' || inputs.verificar)
        run: python scripts/actualizar.py --verificar

      - name: Buscar obras nuevas en fallas.com
        if: steps.hora.outputs.seguir == '1' && github.event_name != 'push' && !inputs.verificar
        run: python scripts/actualizar.py

      - name: Guardar cambios
        if: steps.hora.outputs.seguir == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f verificacion.json ] && git add verificacion.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Datos: revisión automática $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase origin main
          git push origin HEAD:main
