name: Actualizar datos

on:
  schedule:
    # Una revisión al día a las 10:00 de Valencia. GitHub usa hora UTC, así que se programa a las
    # 08:00 y a las 09:00 UTC y el paso "¿Son las 10 en Valencia?" deja pasar solo la que toca
    # (08:00 en horario de verano, 09:00 en invierno). GitHub puede retrasar unos minutos el arranque.
    - cron: "0 8,9 * * *"
  workflow_dispatch:
    inputs:
      verificar:
        description: "Releer las obras guardadas y comparar (no añade obras)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ¿Son las 10 en Valencia?
        id: hora
        run: |
          h=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$h" = "10" ]; then echo "seguir=1" >> "$GITHUB_OUTPUT"; else echo "Son las $h en Valencia; esta ejecución no toca."; fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == '1'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == '1'
        with:
          python-version: "3.12"

      - name: Verificar el lector con las obras conocidas
        if: steps.hora.outputs.seguir == '1' && (github.event_name == 'push' || inputs.verificar)
        run: python scripts/actualizar.py --verificar

      - name: Buscar obras nuevas en fallas.com
        if: steps.hora.outputs.seguir == '1' && github.event_name != 'push' && !inputs.verificar
        run: python scripts/actualizar.py

      - name: Guardar cambios
        if: steps.hora.outputs.seguir == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f verificacion.json ] && git add verificacion.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Datos: revisión automática $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase origin main
          git push origin HEAD:main
